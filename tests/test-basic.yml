name: Test basic package validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up PKGBUILD in workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/PKGBUILD" "$GITHUB_WORKSPACE/PKGBUILD"

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add PKGBUILD
          git commit -m "Add PKGBUILD for test" || true
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action - validate PKGBUILD with namcap, skip makepkg
        id: action
        uses: .
        with:
          namcap: 'true'
          flags: ''
          archlinux_keyring: 'false'
          updpkgsums: 'false'
          srcinfo: 'false'
          aur: 'false'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
