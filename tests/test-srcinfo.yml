name: Test .SRCINFO generation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PKGBUILD in workspace root
        run: |
          cp tests/fixtures/PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD"

      - name: Initialize git repo state (needed for git diff in entrypoint)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          git add PKGBUILD
          git commit -m "add PKGBUILD" --allow-empty

      - id: action
        uses: .
        with:
          srcinfo: 'true'
          namcap: 'false'
          archlinux_keyring: 'false'
          flags: '-cfs --noconfirm'

      - name: Assert .SRCINFO was generated
        run: |
          echo "Workspace contents:"
          ls -la "$GITHUB_WORKSPACE/"
          echo ".SRCINFO contents:"
          cat "$GITHUB_WORKSPACE/.SRCINFO" || true
          if [ ! -f "$GITHUB_WORKSPACE/.SRCINFO" ]; then
            echo "FAIL: .SRCINFO was not generated"
            exit 1
          fi
          echo "PASS: .SRCINFO was generated"

      - name: Assert .SRCINFO contains package name
        run: |
          if ! grep -q "pkgbase = hello-world-test" "$GITHUB_WORKSPACE/.SRCINFO"; then
            echo "FAIL: .SRCINFO does not contain expected pkgbase"
            exit 1
          fi
          echo "PASS: .SRCINFO contains correct pkgbase"
