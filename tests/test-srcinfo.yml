name: Test .SRCINFO generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal PKGBUILD
        run: |
          cat > "$GITHUB_WORKSPACE/PKGBUILD" << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=hello-srcinfo
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A minimal test package for srcinfo generation"
          arch=('any')
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            install -dm755 "$pkgdir/usr/share/$pkgname"
            echo "hello" > "$pkgdir/usr/share/$pkgname/hello.txt"
          }
          EOF

      - name: Set up git config and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add PKGBUILD
          git commit -m "Add PKGBUILD for srcinfo test" || true
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          srcinfo: 'true'
          flags: '-cfs --noconfirm'
          namcap: 'false'
          archlinux_keyring: 'true'

      - name: Assert .SRCINFO was generated
        run: |
          echo "Checking that .SRCINFO was generated"
          if [ -f "$GITHUB_WORKSPACE/.SRCINFO" ]; then
            echo "PASS: .SRCINFO file was generated"
            echo "Contents:"
            cat "$GITHUB_WORKSPACE/.SRCINFO"
          else
            echo "FAIL: .SRCINFO file was not generated"
            exit 1
          fi
