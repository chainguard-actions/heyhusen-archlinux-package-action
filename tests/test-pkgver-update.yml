name: Test pkgver and pkgrel update
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PKGBUILD in workspace root
        run: |
          cp tests/fixtures/PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD"

      - name: Initialize git repo state (needed for git diff in entrypoint)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          git add PKGBUILD
          git commit -m "add PKGBUILD" --allow-empty

      - id: action
        uses: .
        with:
          pkgver: '2.0.0'
          pkgrel: '3'
          namcap: 'false'
          archlinux_keyring: 'false'
          flags: '-cfs --noconfirm'

      - name: Assert pkgver was updated in PKGBUILD
        run: |
          echo "PKGBUILD contents:"
          cat "$GITHUB_WORKSPACE/PKGBUILD"
          if ! grep -q "^pkgver=2.0.0$" "$GITHUB_WORKSPACE/PKGBUILD"; then
            echo "FAIL: pkgver was not updated to 2.0.0"
            exit 1
          fi
          echo "PASS: pkgver updated correctly"

      - name: Assert pkgrel was updated in PKGBUILD
        run: |
          if ! grep -q "^pkgrel=3$" "$GITHUB_WORKSPACE/PKGBUILD"; then
            echo "FAIL: pkgrel was not updated to 3"
            exit 1
          fi
          echo "PASS: pkgrel updated correctly"
