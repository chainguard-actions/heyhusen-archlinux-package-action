name: Test pkgver and pkgrel update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/pkg
          pkgver: '2.0.0'
          pkgrel: '3'
          flags: '-cfs --noconfirm'
          namcap: 'false'
          archlinux_keyring: 'false'
      - name: Assert pkgver was updated in PKGBUILD
        run: |
          PKGBUILD_PATH="$GITHUB_WORKSPACE/tests/fixtures/pkg/PKGBUILD"
          echo "Contents of PKGBUILD after action:"
          cat "$PKGBUILD_PATH"
          if ! grep -q "^pkgver=2.0.0$" "$PKGBUILD_PATH"; then
            echo "FAIL: pkgver was not updated to 2.0.0"
            exit 1
          fi
          echo "PASS: pkgver updated correctly"
      - name: Assert pkgrel was updated in PKGBUILD
        run: |
          PKGBUILD_PATH="$GITHUB_WORKSPACE/tests/fixtures/pkg/PKGBUILD"
          if ! grep -q "^pkgrel=3$" "$PKGBUILD_PATH"; then
            echo "FAIL: pkgrel was not updated to 3"
            exit 1
          fi
          echo "PASS: pkgrel updated correctly"
